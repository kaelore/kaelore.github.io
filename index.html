<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaelore</title>

    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #111;
            color: #ccc;
            font-family: system-ui, sans-serif;
            display: grid;
            place-items: center;
        }

        p {
            margin: 0;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body>

<p id="status">Connessione in corso…</p>

<script>
async function loadTunnel() {
    const status = document.getElementById('status');

    try {
        const response = await fetch('./config.json?t=' + Date.now());
        const config = await response.json();

        if (!config.url) {
            status.textContent = 'Tunnel non ancora disponibile. Riprovo…';
            return;
        }

        // Redirect di prima parte: login/cookie funzionano sul tunnel
        location.replace(config.url);

    } catch (error) {
        console.error('Impossibile recuperare il tunnel:', error);
        status.textContent = 'Errore nel recuperare il tunnel. Riprovo…';
    }
}

loadTunnel();
setInterval(loadTunnel, 5000);
</script>

</body>
</html>
